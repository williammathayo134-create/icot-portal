<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mlango wa Mwalimu - ICoT</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 450px; margin: 40px auto; background: #1e293b; padding: 25px; border-radius: 10px; border-top: 4px solid #38bdf8; }
        h2 { color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 13px; }
        input { width: 100%; padding: 10px; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #38bdf8; color: #0f172a; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mlango wa Mwalimu</h2>
        <p style="text-align: center; font-size: 12px; color: #94a3b8;">Weka majina, email, na Special Code yako.</p>
        <form action="/teacher-dashboard.html" method="GET">
            <div class="form-group">
                <label>Majina Kamili:</label>
                <input type="text" name="teacher_name" placeholder="Jina lako kamili" required>
            </div>
            <div class="form-group">
                <label>Email Yako:</label>
                <input type="email" name="teacher_email" placeholder="mwalimu@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Special Code (Kutoka Mfumo):</label>
                <input type="text" name="special_code" placeholder="ICoT-TCH-XXXX" required>
            </div>
            <button type="submit">Ingia Kwenye Dashibodi</button>
        </form>
    </div>
</body>
</html>
